 for(let i=0;i<22;i++){x.fillStyle=`rgba(${i%2?'255,255,255':'0,0,0'},${.05+Math.random()*.1})`;const y=Math.random()*128;x.beginPath();x.moveTo(0,y);for(let k=0;k<=256;k+=16)x.lineTo(k,y+Math.sin(k/20+i)*4);x.lineTo(256,y+10+Math.random()*14);x.lineTo(0,y+10+Math.random()*14);x.fill()}
 for(let i=0;i<260;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.12})`;x.fillRect(Math.random()*256,Math.random()*128,2,2)}
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
const core=new THREE.Mesh(new THREE.SphereGeometry(13,64,48),new THREE.MeshBasicMaterial({map:tex(META.core)}));scene.add(core);
[[META.core,60,.9],[META.core,130,.35]].forEach(a=>{const g=glow(...a);scene.add(g)});
D.forEach((d,i)=>{d.R=58+(i%3)*24;d.ang=i/D.length*TAU;d.sp=.16/(1+d.R/50);
 const pts=[];for(let k=0;k<=128;k++)pts.push(new THREE.Vector3(Math.cos(k/128*TAU)*d.R,0,Math.sin(k/128*TAU)*d.R));
 if(i<3)scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x4d6a8c,transparent:true,opacity:.28})));
 const m=new THREE.Mesh(new THREE.SphereGeometry(7,48,32),new THREE.MeshStandardMaterial({map:tex(d.col),roughness:.85,emissive:new THREE.Color(d.col),emissiveIntensity:.12}));
 m.add(glow(d.col,30,.45));m.userData.i=i;scene.add(m);d.mesh=m;
 if(d.logo){const t=new THREE.TextureLoader().load(d.logo);t.encoding=THREE.sRGBEncoding;d.lg=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));d.lg.scale.set(11.5,11.5,1);scene.add(d.lg)}
 const l=document.createElement('div');l.className='lbl';l.textContent=d.lb;document.body.appendChild(l);d.el=l});
const coreLbl=document.createElement('div');coreLbl.className='lbl';coreLbl.textContent=META.coreLabel;coreLbl.style.fontSize='14px';document.body.appendChild(coreLbl);

/* ---- الواجهة ---- */
let sel=null,sup=false,tab='i',seen=new Set(),toasted=false;
const chips=$('#chips'),mk=(h,f)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=h;b.onclick=f;chips.appendChild(b);return b};
const allB=mk('🌌 الكل',()=>pick(-1));
D.forEach((d,i)=>{const b=mk(`<i></i>${d.lb}`,()=>pick(i));b.style.setProperty('--c',d.col);d.chip=b});
$('#cnt').textContent=`0/${D.length}`;
$('#sp').onclick=()=>{sup=!sup;$('#sp').classList.toggle('on',sup);tab='i';render()};
const list=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
function info(d){let h=`<h2>${d.ar}</h2><span class="en">${d.n}</span><p class="tg">${d.tag}</p><h4>${META.l1}</h4><p>${d.d}</p>`;
 d.sec.forEach(([t,v])=>{h+=`<h4>${t}</h4>`+(Array.isArray(v)?list(v):v.code?`<pre>${esc(v.code)}</pre>`:`<p>${v}</p>`)});
 return h+`<h4>${META.l2}</h4><div class="stars">${'★'.repeat(d.diff)+'☆'.repeat(5-d.diff)}</div><div class="fact">💡 هل تعلم؟ ${d.fact}</div>`}
function supv(d){return `<h2>${d.ar}</h2><span class="en">${d.n}</span><h4>تشبيه بسيط للطالب</h4><p>${d.an}</p><h4>أسئلة متوقعة وإجاباتها</h4>`+d.qa.map(([q,a])=>`<div class="qa"><b>${q}</b>${a}</div>`).join('')}
function general(){return `<h2>دليل المشرف</h2><span class="en">${META.title}</span><h4>نقاط تقولها للطلاب</h4>${list(META.sup)}`}
function render(){const s=$('#sheet');if(!sel&&!sup){s.classList.remove('on');return}
 s.style.setProperty('--c',sel?sel.col:'#ffc247');let h='';
 if(sup&&sel)h+=`<div class="tabs"><button class="tb ${tab=='i'?'a':''}" data-t="i">الشرح</button><button class="tb ${tab=='s'?'a':''}" data-t="s">للمشرف</button></div>`;
 h+=!sel?general():(!sup||tab=='i')?info(sel):supv(sel);s.innerHTML=h;s.scrollTop=0;s.classList.add('on');
 s.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()})}
function pick(i){sel=i<0?null:D[i];want=sel?26:215;tab='i';$('#hint').style.opacity=0;
 allB.classList.toggle('on',!sel);D.forEach(d=>d.chip.classList.toggle('on',d===sel));
 if(sel){seen.add(sel.n);sel.chip.classList.add('seen');$('#cnt').textContent=`${seen.size}/${D.length}`;sel.chip.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  if(seen.size===D.length&&!toasted){toasted=true;setTimeout(()=>{const t=$('#toast');t.innerHTML=META.done;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),6000)},900)}}
 render()}
$('#toast').onclick=()=>$('#toast').classList.remove('on');

/* ---- الكاميرا والتفاعل ---- */
let yaw=.6,pitch=.45,dist=215,want=215,offY=0,idle=0;const cur=new THREE.Vector3();allB.classList.add('on');
const cv=renderer.domElement,ptr=new Map();let pinch=0,down={x:0,y:0},moved=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});down={x:e.clientX,y:e.clientY};moved=0;pinch=0;idle=3;$('#hint').style.opacity=0});
cv.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);idle=3;
 if(ptr.size===2){const[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)want=clamp(want*Math.exp(-(d-pinch)*.006),14,330);pinch=d;return}
 yaw-=dx*.006;pitch=clamp(pitch+dy*.006,-1.2,1.3)});
const up=e=>{ptr.delete(e.pointerId);pinch=0;
 if(e.type==='pointerup'&&ptr.size===0&&moved<8){const rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),camera);
  const h=rc.intersectObjects(D.map(d=>d.mesh),false)[0];if(h)pick(h.object.userData.i)}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();want=clamp(want*Math.exp(e.deltaY*.001),14,330)},{passive:false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock(),v3=new THREE.Vector3();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);
 core.rotation.y+=dt*.2;
 D.forEach(d=>{d.ang+=d.sp*dt;d.mesh.position.set(Math.cos(d.ang)*d.R,Math.sin(d.ang*2+d.R)*3,Math.sin(d.ang)*d.R);d.mesh.rotation.y+=dt*.4;if(d.lg){v3.copy(camera.position).sub(d.mesh.position).normalize().multiplyScalar(7.6);d.lg.position.copy(d.mesh.position).add(v3)}});
 if(!sel&&idle<=0)yaw+=dt*.07;idle=Math.max(0,idle-dt);
 cur.lerp(sel?sel.mesh.position:v3.set(0,0,0),1-Math.exp(-5*dt));dist+=(want-dist)*(1-Math.exp(-4*dt));
 const c=Math.cos(pitch);camera.position.set(cur.x+Math.sin(yaw)*c*dist,cur.y+Math.sin(pitch)*dist,cur.z+Math.cos(yaw)*c*dist);camera.lookAt(cur);
 const H=innerHeight;offY+=((sel||sup?H*.2:0)-offY)*(1-Math.exp(-4*dt));camera.setViewOffset(innerWidth,H,0,offY,innerWidth,H);
 const lab=(el,pos,r,show)=>{v3.copy(pos);v3.y+=r*1.5;v3.project(camera);const ok=show&&v3.z<1&&Math.abs(v3.x)<1.1&&Math.abs(v3.y)<1.1;el.style.display=ok?'block':'none';if(ok)el.style.transform=`translate(${(v3.x*.5+.5)*innerWidth}px,${(-v3.y*.5+.5)*H}px) translate(-50%,-100%)`};
 D.forEach(d=>lab(d.el,d.mesh.position,7,dist>40||d!==sel));lab(coreLbl,core.position,13,dist>40);
 renderer.render(scene,camera)}
frame();
</script>
</body>
